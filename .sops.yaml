#   - neptune: the machine's SSH host key converted to age — lets it decrypt at boot
# See hosts/neptune/README.md.
keys:
  - &kirpal age13vppfkpvnssvvzqthzu4v807ea09usqa9ggyec4mt9rvmv56harq36j98f
  - &neptune age1ddnvl9fcylqekhcetyfl8hrv4twpz3j5fg0pxhs6yp5t94qyv5fqdyr860
creation_rules:
  - path_regex: hosts/neptune/secrets\.yaml$
    key_groups:
      - age:
          - *kirpal
          - *neptune
