# sops-nix recipients. Secrets are encrypted to:
#   - kirpal: your personal age key (~/.config/sops/age/keys.txt) — lets you edit
#   - neptune: the machine's SSH host key converted to age — lets it decrypt at boot
# Replace the placeholders; see hosts/neptune/README.md.
keys:
  - &kirpal age1REPLACE_WITH_YOUR_PERSONAL_AGE_PUBLIC_KEY
  - &neptune age1REPLACE_WITH_NEPTUNE_HOST_AGE_PUBLIC_KEY
creation_rules:
  - path_regex: hosts/neptune/secrets\.yaml$
    key_groups:
      - age:
          - *kirpal
          - *neptune
